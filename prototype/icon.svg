<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark void background (reused from prior icon: same bg gradient stops) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F1E"/>
      <stop offset="1" stop-color="#060810"/>
    </linearGradient>
    <!-- Stumps: --gold-bright (#DAA520) -> --gold / Antique Gold (#B8862F) -->
    <linearGradient id="rec-stump" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#B8862F"/>
    </linearGradient>
    <!-- Crown arch + diamond: --blood / Blood Red (#CC1100) -> --crimson / Crimson Deep (#8B0000) -->
    <linearGradient id="rec-bail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC1100"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <!-- Base bar: symmetric --crimson -> --blood -> --crimson -->
    <linearGradient id="rec-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="50%" stop-color="#CC1100"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <!-- Soft gold-tinted glow behind the mark -->
    <radialGradient id="rec-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(218,165,32,0.14)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Dark void backdrop so the mark holds contrast on any home-screen background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Stump Crown mark, source geometry is viewBox 0 0 200 200 (design-lab bolt-round5-logo
       Logos.tsx LogoRecommended / LogoStumpCrown). Scaled uniformly by 512/200 = 2.56 via a
       single group transform so every coordinate scales by the same factor. -->
  <g transform="scale(2.56)">
    <!-- Glow background -->
    <circle cx="100" cy="100" r="80" fill="url(#rec-glow)"/>

    <!-- Three stumps - center taller -->
    <rect x="52" y="52" width="13" height="83" rx="1.5" fill="url(#rec-stump)"/>
    <rect x="93.5" y="38" width="13" height="97" rx="1.5" fill="url(#rec-stump)"/>
    <rect x="135" y="52" width="13" height="83" rx="1.5" fill="url(#rec-stump)"/>

    <!-- Stump caps - pointed, burnished gold (NOT lemon gold) -->
    <path d="M 52 52 L 58.5 44 L 65 52 Z" fill="#DAA520"/>
    <path d="M 93.5 38 L 100 30 L 106.5 38 Z" fill="#DAA520"/>
    <path d="M 135 52 L 141.5 44 L 148 52 Z" fill="#DAA520"/>

    <!-- Bails - crown arch connecting all three -->
    <path
      d="M 58.5 48 Q 79 35 100 34 Q 121 35 141.5 48 L 141.5 54 Q 121 41 100 40 Q 79 41 58.5 54 Z"
      fill="url(#rec-bail)"
    />

    <!-- Base bar -->
    <rect x="38" y="135" width="124" height="9" rx="2" fill="url(#rec-base)"/>

    <!-- Diamond accent - burnished gold (NOT lemon gold) -->
    <path d="M 100 152 L 110 162 L 100 172 L 90 162 Z" fill="#DAA520"/>
    <path d="M 100 156 L 107 162 L 100 168 L 93 162 Z" fill="#050608" opacity="0.4"/>
  </g>
</svg>
